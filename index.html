<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>急診學習站寵物</title><meta name="theme-color" content="#24407E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#FFF7EE;--surface:#fff;--surface-2:#FFF1E2;--ink:#2B2118;--ink-2:#7A6A5C;--line:#F0DDC8;--brand:#24407E;--pc:#3B5BA9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130F;--surface:#221C16;--surface-2:#2C241C;--ink:#F5EDE4;--ink-2:#BCAE9F;--line:#3D3228;--brand:#8FB0F5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130F;--surface:#221C16;--surface-2:#2C241C;--ink:#F5EDE4;--ink-2:#BCAE9F;--line:#3D3228;--brand:#8FB0F5;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;line-height:1.55}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:linear-gradient(120deg,#24407E,#3B66B8);color:#fff;box-shadow:0 8px 20px -14px rgba(0,0,0,.6)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}.brand b{display:block;font-size:18px;font-weight:900;white-space:nowrap}.brand small{display:block;font-size:12px;opacity:.85;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:24px;flex:none}
.topr{display:flex;align-items:center;gap:10px}.who{display:grid;justify-items:end;gap:2px}.who b{font-size:14px}
.xpm{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}.xpm .bar{width:90px;height:7px;margin:0;background:rgba(255,255,255,.3)}.xpm .bar i{background:#FFD45C}
.tteam{font-size:13px;font-weight:800;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;white-space:nowrap}
@media (max-width:520px){.brand small,.tteam{display:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tabs a{display:grid;justify-items:center;gap:0;text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:700;padding:6px 2px;border-radius:12px}.tabs a i{font-style:normal;font-size:22px}.tabs a.on{color:var(--brand);background:var(--surface-2)}
.tabs[hidden]{display:none}
main{max-width:1180px;margin:0 auto;padding:16px 16px 96px}
@media (min-width:1000px){.tabs{top:62px;bottom:0;right:auto;width:180px;grid-template-columns:1fr;align-content:start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:16px 10px}
  .tabs a{grid-template-columns:32px 1fr;justify-items:start;align-items:center;font-size:16px;padding:10px 12px}main{margin-left:180px;padding:22px 28px 40px;max-width:1240px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:16px;box-shadow:0 10px 26px -22px rgba(80,40,0,.5)}
.card h3{margin:0 0 12px;font-size:18px}.card h3 small{font-weight:500;color:var(--ink-2);font-size:13px;margin-left:6px}
.hero{background:linear-gradient(135deg,#FFE3C4,#FFF1E2);border-radius:24px;padding:20px 22px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;color:var(--ink-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#3A2A1A,#2C241C)}}
.hint{color:var(--ink-2);font-size:13px;margin:6px 0}.hint.warn{color:#C2410C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:14px;padding:10px 18px;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
.btn.big{font-size:17px;padding:13px 24px}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.mini{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.fld{display:grid;gap:6px;font-weight:700;font-size:14px;margin:10px 0}.fld input{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:9px;border-radius:99px;background:color-mix(in oklab,var(--pc) 15%,var(--surface-2));overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pc),color-mix(in oklab,var(--pc) 55%,#fff))}.bar.big{height:13px}
.petsvg,.petimg{width:100%;height:auto;display:block}
.lock{filter:brightness(0) opacity(.16)}
/* 領養 */
.adopt{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.ac{display:grid;gap:4px;justify-items:center;text-align:center;font:inherit;color:var(--ink);background:var(--surface);border:2px solid color-mix(in oklab,var(--pc) 30%,var(--line));border-radius:22px;padding:12px;cursor:pointer}
.ac .aca{width:132px}.ac b{font-size:17px}.ac span{font-size:13px;font-weight:800;color:var(--pc)}.ac small{font-size:12px;color:var(--ink-2)}
.ac.on{border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in oklab,var(--pc) 25%,transparent)}.adopt.preview .ac{cursor:default}
.login{display:grid;gap:8px;justify-items:start}
/* 小屋 */
.homeg{display:grid;gap:16px;margin-bottom:16px}@media (min-width:900px){.homeg{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.room{position:relative;border-radius:26px;overflow:hidden;min-height:380px;display:grid;align-content:end;justify-items:center;padding:16px;border:1px solid var(--line);box-shadow:0 14px 30px -22px rgba(80,40,0,.6)}
.roombg{position:absolute;inset:0;width:100%;height:100%}
.petw{position:relative;width:min(300px,72%);cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:1}.petw.big{width:min(320px,100%);margin:0 auto}
.petw>svg,.petw>img,.petw .pimgw{filter:drop-shadow(0 12px 16px rgba(0,0,0,.18))}
@media (prefers-reduced-motion:no-preference){.petw>svg{animation:breath 3.6s ease-in-out infinite}}
@keyframes breath{50%{transform:scale(1.015,.99)}}
.petw.bounce>*{animation:bounce .7s ease}.petw.jump>*{animation:jump .8s ease}.petw.spin>*{animation:wig .9s ease}.petw.shake>*{animation:wig .5s ease}.petw.sleep>*{animation:none;filter:brightness(.82) drop-shadow(0 12px 16px rgba(0,0,0,.18))}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px) scale(1.03)}60%{transform:translateY(0) scale(.98)}}
@keyframes jump{0%,100%{transform:translateY(0)}20%{transform:translateY(-30px)}40%{transform:translateY(0)}60%{transform:translateY(-16px)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.petw.sleep::after{content:"z Z z";position:absolute;top:4%;right:4%;font-weight:900;color:#7a8a9a;font-size:22px;animation:fx 2s ease-out}
.fx{position:absolute;bottom:45%;font-style:normal;color:#E5484D;font-size:24px;animation:fx 1.5s ease-out forwards;pointer-events:none}@keyframes fx{to{transform:translateY(-130px);opacity:0}}
.bub{position:relative;z-index:2;justify-self:center;background:var(--surface);border:2px solid var(--pc);border-radius:18px;padding:8px 16px;font-weight:800;margin-bottom:6px;max-width:90%;text-align:center;box-shadow:0 8px 18px -12px rgba(0,0,0,.5)}
.bub::after{content:"";position:absolute;left:50%;bottom:-10px;border:9px solid transparent;border-top-color:var(--pc);border-bottom:0;transform:translateX(-50%)}
.bub.pop{animation:pop .25s ease}@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.acts{position:relative;z-index:2;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.acts button{display:grid;justify-items:center;font:inherit;font-size:12px;font-weight:800;color:var(--ink);background:color-mix(in oklab,var(--surface) 88%,transparent);backdrop-filter:blur(6px);border:1.5px solid var(--line);border-radius:16px;padding:6px 12px;cursor:pointer;min-width:58px}.acts i{font-style:normal;font-size:22px}
.info .ih{display:flex;align-items:center;gap:10px}.info h2{margin:0;font-size:26px}
.itag{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0}.itag b{font-size:17px}.itag small{color:var(--ink-2)}
.lvp{font-size:12.5px;font-weight:800;color:#fff;background:var(--pc);border-radius:999px;padding:2px 10px}
.aff{display:flex;align-items:center;gap:4px;margin:8px 0}.aff i{font-style:normal;font-size:20px;color:var(--line)}.aff i.on{color:#E5484D}.aff small{margin-left:6px;color:var(--ink-2)}
.feed{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.feed button{display:grid;justify-items:center;gap:1px;font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:16px;padding:8px 4px;cursor:pointer}.feed i{font-style:normal;font-size:26px}.feed b{font-size:14px}.feed small{font-size:11px;color:var(--ink-2)}
.feed button:disabled{opacity:.45;cursor:default}.feed button:not(:disabled):hover{border-color:var(--pc)}
.gate{display:grid;gap:4px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-size:14px}.gate span{color:var(--ink-2)}.gate span.y{color:#1B7D63;font-weight:700}.gate.ok{background:color-mix(in oklab,#E8A317 16%,var(--surface))}.gate .btn{justify-self:start;margin-top:6px}
.evo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media (max-width:640px){.evo{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ev{display:grid;gap:4px;justify-items:center;text-align:center;border:1.5px solid var(--line);border-radius:18px;padding:10px;background:var(--surface)}.ev.now{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in oklab,var(--pc) 22%,transparent)}
.ev .lvb{font-size:12px;font-weight:800;color:#fff;background:var(--pc);border-radius:999px;padding:2px 10px}.ev:not(.on) .lvb{background:var(--ink-2)}.ev small{font-size:12.5px}.ev em{font-style:normal;font-size:11px;color:var(--ink-2)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.rm{display:grid;gap:4px;font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px;cursor:pointer}.rm svg{width:100%;border-radius:10px;display:block}.rm small{color:var(--ink-2);font-size:12px}.rm.on{border-color:var(--pc)}.rm:disabled{opacity:.6;cursor:default}
/* 任務 */
.haves{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.haves div{display:grid;justify-items:center;background:var(--surface-2);border-radius:16px;padding:8px}.haves i{font-style:normal;font-size:26px}.haves b{font-size:22px}.haves small{color:var(--ink-2)}
.tasks{display:grid;gap:8px}
.tk{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface-2);border-radius:16px;padding:10px 14px}.tk>i{font-style:normal;font-size:26px}.tk b{display:block}.tk small{color:var(--ink-2);font-size:12.5px}.tk em{font-style:normal;font-weight:800;color:var(--brand);font-size:13px;white-space:nowrap}.tk.done em{color:#1B7D63}
/* 換裝 */
.dressg{display:grid;gap:16px}@media (min-width:900px){.dressg{grid-template-columns:minmax(260px,360px) minmax(0,1fr);align-items:start}}
.dprev{display:grid;gap:10px;justify-items:center;background:linear-gradient(160deg,color-mix(in oklab,var(--pc) 14%,var(--surface)),var(--surface))}
.slot{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}.slot>b{padding-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}.op{display:grid;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;text-align:left}.op small{font-size:11px;color:var(--ink-2);font-weight:500}.op.on{border-color:var(--pc);background:color-mix(in oklab,var(--pc) 14%,var(--surface))}.op:disabled{opacity:.5;cursor:default}
.pimgw{position:relative}.obadges{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}.obadges span{font-size:11px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
/* 圖鑑 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:10px}
.dc{display:grid;gap:3px;justify-items:center;text-align:center;border-radius:18px;padding:10px;background:color-mix(in oklab,var(--pc) 9%,var(--surface));border:1.5px solid color-mix(in oklab,var(--pc) 25%,var(--line))}.dc.lockc{background:var(--surface-2);border-color:var(--line)}
.dca{width:118px}.dc small{color:var(--ink-2);font-size:12px}.dc p{margin:4px 0 0;font-size:12.5px;line-height:1.5;text-align:left}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.ach div{display:grid;justify-items:center;text-align:center;gap:2px;border-radius:16px;padding:10px;background:var(--surface-2);opacity:.45;filter:grayscale(1)}.ach div.on{opacity:1;filter:none;background:color-mix(in oklab,#E8A317 14%,var(--surface))}.ach i{font-style:normal;font-size:28px}.ach small{color:var(--ink-2);font-size:12px}
/* 紀錄 */
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.kpi div{display:grid;justify-items:center;background:var(--surface-2);border-radius:16px;padding:10px}.kpi i{font-style:normal;font-size:24px}.kpi b{font-size:22px}.kpi small{color:var(--ink-2)}
.wk{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:160px;padding-top:10px}.wk div{display:grid;grid-template-rows:1fr auto auto;height:100%;align-items:end;justify-items:center}.wk span{width:70%;min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--pc),color-mix(in oklab,var(--pc) 50%,#fff))}.wk small{font-size:10px;color:var(--ink-2)}.wk b{font-size:11px}
.sl{list-style:none;margin:0;padding:0;display:grid;gap:6px}.sl li{display:flex;flex-wrap:wrap;gap:4px 10px;background:var(--surface-2);border-radius:12px;padding:8px 12px}.sl time{font-family:monospace;color:var(--ink-2)}.sl span{color:var(--ink-2)}
/* 進化 */
.evov{position:fixed;inset:0;z-index:90;background:rgba(10,16,22,.72);display:grid;place-items:center;padding:16px}
.evbox{background:var(--surface);border-radius:26px;padding:22px;max-width:420px;width:100%;display:grid;gap:8px;justify-items:center;text-align:center}
.evart{position:relative;width:240px;height:252px}.evart>div{position:absolute;inset:0}
.evf{animation:evout 1.6s ease forwards}.evt{opacity:0;animation:evin 1.6s ease .9s forwards}
@keyframes evout{0%{opacity:1}60%{opacity:1;filter:brightness(3) blur(1px)}100%{opacity:0;transform:scale(.8)}}
@keyframes evin{0%{opacity:0;transform:scale(.6);filter:brightness(3)}100%{opacity:1;transform:scale(1);filter:none}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#2B2118;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:95}.toast.show{opacity:1;transform:translateX(-50%)}.toast.bad{background:#B42318}
.conf{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:conf 2.2s ease-in forwards}@keyframes conf{to{top:105%;transform:rotate(720deg)}}
.foot{color:var(--ink-2);font-size:12px;text-align:center;margin-top:20px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sk{display:grid;gap:3px;justify-items:center;text-align:center;font:inherit;color:var(--ink);background:var(--surface-2);border:2px solid var(--line);border-radius:18px;padding:10px;cursor:pointer}
.sk .ska{width:110px}.sk small{color:var(--ink-2);font-size:12px}.sk.on{border-color:var(--pc);background:color-mix(in oklab,var(--pc) 12%,var(--surface));box-shadow:0 0 0 3px color-mix(in oklab,var(--pc) 22%,transparent)}.sk:disabled{cursor:default;opacity:.75}
.dprev b{font-size:18px}

.hubback{flex:none;text-decoration:none;font-weight:800;font-size:14px;color:var(--brand);background:#fff;border-radius:12px;padding:7px 11px;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap;margin-right:4px}
@media (max-width:520px){.hubback{padding:6px 9px;font-size:13px}}
.top .brand{margin-right:auto}
/* ===== 小屋 3D ===== */
.room{min-height:420px;box-shadow:0 22px 40px -24px rgba(80,40,0,.7),inset 0 0 0 1px rgba(255,255,255,.4)}
.room::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 100%,rgba(255,240,210,.25),transparent);pointer-events:none}
.room.night .roombg{filter:brightness(.42) saturate(.7) hue-rotate(200deg);transition:filter .8s}.room .roombg{transition:filter .8s}
.room.night::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(40% 30% at 50% 60%,rgba(255,230,160,.18),transparent);pointer-events:none}
.petw{margin-bottom:22px}
.petw.pet>svg,.petw.pet>.pimgw{animation:petsq .45s ease-in-out 4}
@keyframes petsq{50%{transform:scale(1.03,.96) translateY(4px)}}
.petw.nom>svg,.petw.nom>.pimgw{animation:nom .22s ease-in-out 6 1.1s}
@keyframes nom{50%{transform:scale(1.02,.95)}}
.petw.hop>svg,.petw.hop>.pimgw{animation:hop .5s ease 3 .3s}
@keyframes hop{40%{transform:translateY(-22px) rotate(-5deg)}70%{transform:translateY(0) rotate(4deg)}}
/* 互動道具層：在寵物上方 */
.fxl{position:absolute;inset:-10% -20% 0;pointer-events:none;z-index:3}
.fxo{position:absolute}
.fxup{left:50%}.fxup i{display:block;font-style:normal;font-size:26px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));animation:fxup 2s ease-out forwards;animation-delay:inherit;opacity:0}
@keyframes fxup{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-110px) scale(.9) rotate(12deg)}}
.fxtxt{left:50%;transform:translateX(-50%);white-space:nowrap}.fxtxt b{display:block;font:900 18px "Noto Sans TC",sans-serif;color:#1B7D63;background:#fff;border:2px solid #1B7D63;border-radius:999px;padding:2px 12px;box-shadow:0 6px 12px -6px rgba(0,0,0,.4);animation:fxtxt 1.8s ease-out forwards}
@keyframes fxtxt{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-40px)}}
.hand3d{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
.fxhand{width:38%;right:-4%}
.fxhand.pat{animation:handin .4s ease-out forwards,handrub .45s ease-in-out .4s 4,handout .35s ease-in 2.2s forwards}
@keyframes handin{from{transform:translate(60%,-60%) rotate(20deg);opacity:0}to{transform:translate(-50%,0) rotate(0);opacity:1}}
@keyframes handrub{0%,100%{transform:translate(-50%,0) rotate(0)}50%{transform:translate(-80%,6%) rotate(-10deg)}}
@keyframes handout{to{transform:translate(60%,-60%) rotate(20deg);opacity:0}}
.fxhand.fdin{animation:feedin .9s cubic-bezier(.2,.8,.3,1) forwards,feedwig .3s ease-in-out .9s 3,handout .4s ease-in 1.9s forwards}
@keyframes feedin{from{transform:translate(70%,30%);opacity:0}to{transform:translate(-62%,0);opacity:1}}
@keyframes feedwig{50%{transform:translate(-66%,3%) rotate(-6deg)}}
.crumb{width:7px;height:7px;border-radius:50%;background:#D27A45;animation:crumb 1.1s ease-in forwards}
@keyframes crumb{0%{transform:translate(0,0)}100%{transform:translate(calc((var(--r,1) - .5) * 60px),70px);opacity:0}}
.fxball{bottom:2%;left:0;animation:ball 2.5s linear forwards}
.fxball .it3d{display:block;animation:ballup .62s cubic-bezier(.3,0,.7,1) 4 alternate,ballspin .6s linear infinite}

/* ---------- 3D 立體感：把平面色塊換成球面漸層（左上亮、右下暗）＋柔和外框＋高光＋落影 ---------- */
const SH3 = { n: 0 };
function hexMix(h, t, k){ const p = x => parseInt(x, 16), a = [p(h.slice(1, 3)), p(h.slice(3, 5)), p(h.slice(5, 7))], b = t === "w" ? [255, 255, 255] : [20, 12, 8];
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * k).toString(16).padStart(2, "0")).join(""); }
function to3D(svg){
  const id = "s" + (++SH3.n), defs = {}, big = /^#[0-9a-fA-F]{6}$/;
  let out = svg.replace(/fill="(#[0-9a-fA-F]{6})"/g, (m, c) => { const k = c.toLowerCase(); if (k === "#000000" || k === "#111111" || k === "#ffffff") return m;
    const g = `${id}${k.slice(1)}`; defs[g] = `<radialGradient id="${g}" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="${hexMix(k, "w", .42)}"/><stop offset=".5" stop-color="${k}"/><stop offset="1" stop-color="${hexMix(k, "b", .38)}"/></radialGradient>`; return `fill="url(#${g})"`; });
  out = out.replace(/stroke="#3a2a20" stroke-width="3"/g, 'stroke="#3a2a20" stroke-opacity=".28" stroke-width="2"').replace(/stroke="#3a2a20" stroke-width="2(\.5)?"/g, 'stroke="#3a2a20" stroke-opacity=".3" stroke-width="1.6"');
  /* 眼睛的大高光 */
  out = out.replace(/<circle cx="([\d.]+)" cy="([\d.]+)" r="(2\.[0-9]+|2)" fill="#fff"\/>/g, (m, x, y) => `<circle cx="${x}" cy="${y}" r="3.6" fill="#fff"/><circle cx="${+x - 4}" cy="${+y + 5}" r="1.4" fill="#fff" opacity=".8"/>`);
  const extra = `<filter id="${id}f" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3a2a20" flood-opacity=".22"/></filter>
    <radialGradient id="${id}h" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
  out = out.replace(/(<svg[^>]*>)/, `$1<defs>${Object.values(defs).join("")}${extra}</defs>`);
  /* 整隻加落影；頭頂左上加一塊柔光 */
  out = out.replace(/<g transform="translate\(100 (\d+)\) scale\(([\d.]+)\) translate\(-100 -(\d+)\)">/, (m) => m.replace("<g ", `<g filter="url(#${id}f)" `));
  out = out.replace(/<\/svg>$/, `<ellipse cx="80" cy="58" rx="24" ry="14" fill="url(#${id}h)" opacity=".55" transform="rotate(-20 80 58)"/></svg>`);
  return out;
}

    extra: PROP.monitor(116, 78) + PROP.ersign(270, 46) + PROP.shelf(236, 120) + PROP.clock(330, 40) + PROP.plant(338, 214, .8) + PROP.bowl(318, 240, S && S.P && S.P.fedDay === dayKey()) + PROP.bed(200, 224) +
      `<g transform="translate(70 230)"><ellipse cy="4" rx="22" ry="5" fill="rgba(0,0,0,.15)"/><rect x="-16" y="-34" width="32" height="34" rx="5" fill="#fff" stroke="#8FA6B8" stroke-width="2"/><path d="M0 -28 v20 M-10 -18 h20" stroke="#E5484D" stroke-width="6"/></g>` });
  if (r.id === "sky") r.svg = S => `<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121D44"/><stop offset="1" stop-color="#4B5FA8"/></linearGradient><radialGradient id="skyf" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#FF8A3C" stop-opacity="0"/></radialGradient>
      <linearGradient id="skyh1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E9A60"/><stop offset="1" stop-color="#2D6B3E"/></linearGradient><linearGradient id="skyh2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5DB070"/><stop offset="1" stop-color="#3B7F4C"/></linearGradient></defs>
      <rect width="400" height="260" fill="url(#skyg)"/>${[...Array(40)].map((_, i) => `<circle class="twk" cx="${(i * 97) % 400}" cy="${(i * 53) % 150}" r="${i % 5 ? 1.2 : 2}" fill="#fff" style="animation-delay:${(i % 9) * .3}s"/>`).join("")}
      <circle cx="330" cy="50" r="22" fill="#FFF3B0"/><circle cx="340" cy="44" r="20" fill="url(#skyg)"/>
      <path d="M0 170 Q60 140 130 162 T260 150 T400 160 V260 H0Z" fill="#2D5A3A" opacity=".8"/><path d="M0 196 Q100 170 200 190 T400 186 V260 H0Z" fill="url(#skyh1)"/><path d="M0 214 Q120 196 240 212 T400 208 V260 H0Z" fill="url(#skyh2)"/>
      <g transform="translate(70 214)"><path d="M-34 0 L0 -54 L34 0Z" fill="#E5484D"/><path d="M0 -54 L34 0 L14 0Z" fill="#A82E2A"/><path d="M-8 0 L0 -18 L8 0Z" fill="#3B1F1A"/></g>
      <g transform="translate(330 236)"><ellipse rx="40" ry="16" fill="url(#skyf)" class="fire"/><path d="M-12 0 L12 -6 M-12 -6 L12 0" stroke="#6C4A2E" stroke-width="5"/><path d="M0 -4 q-10 -14 0 -28 q4 12 8 6 q4 12 -8 22z" fill="#FF9A3C" class="fire"/></g>
      ${PROP.bed(200, 228)}`;
});

/* ---------- 互動動畫（道具在寵物身上的位置依階段縮放估算） ---------- */
const petGeo = stage => { const sc = [.8, .86, .93, 1][stage || 0], y = v => (196 - (196 - v) * sc) / 210 * 100; return { headTop: y(28), head: y(62), mouth: y(98), belly: y(150) }; };
function fxLayer(){ let L = document.querySelector("#pet .fxl"); if (!L) { L = document.createElement("div"); L.className = "fxl"; $("pet").appendChild(L); } return L; }
function fxAdd(html, cls, style, ms){ const L = fxLayer(), d = document.createElement("div"); d.className = "fxo " + cls; d.innerHTML = html; Object.assign(d.style, style || {}); L.appendChild(d); setTimeout(() => d.remove(), ms || 2000); return d; }
/* 愛心、星星：從頭頂上方冒出來 */
function burst(ch, stage, n = 6){ const g = petGeo(stage);
  for (let i = 0; i < n; i++) fxAdd(`<i>${ch}</i>`, "fxup", { left: (30 + Math.random() * 40) + "%", top: (g.headTop - 4 + Math.random() * 4) + "%", animationDelay: (i * .12) + "s" }, 2200); }
function floatText(t, stage){ const g = petGeo(stage); fxAdd(`<b>${esc(t)}</b>`, "fxtxt", { top: (g.headTop - 10) + "%" }, 1800); }
const PET_ANIM = {
  pat(stage){ const g = petGeo(stage); fxAdd(HAND(), "fxhand pat", { top: (g.headTop - 30) + "%" }, 2300); setTimeout(() => burst("💗", stage, 5), 900); },
  feed(stage, k){ const g = petGeo(stage); fxAdd(HAND(ITEM[k] ? ITEM[k](64) : ""), "fxhand fdin", { top: (g.mouth - 17) + "%" }, 2300);
    setTimeout(() => { for (let i = 0; i < 6; i++) fxAdd("<i></i>", "crumb", { left: (44 + Math.random() * 12) + "%", top: g.mouth + "%", animationDelay: i * .05 + "s" }, 1200); }, 1150); },
  play(stage){ fxAdd(ITEM.ball(46), "fxball", {}, 2600); setTimeout(() => burst("⭐", stage, 4), 1300); },
  cheer(stage){ fxAdd(ITEM.pom(58), "fxpom l", {}, 2000); fxAdd(ITEM.pom(58), "fxpom r", {}, 2000); const g = petGeo(stage);
    fxAdd([...Array(12)].map((_, i) => `<i style="--a:${i * 30}deg">✦</i>`).join(""), "fxring", { top: (g.headTop - 2) + "%" }, 1600); },
  sleep(stage){ const g = petGeo(stage); document.querySelector(".room").classList.add("night"); fxAdd(ITEM.blanket(), "fxblanket", { top: (g.belly - 22) + "%" }, 4200);
    [0, 1, 2].forEach(i => setTimeout(() => fxAdd("<b>Z</b>", "fxz", { top: (g.headTop) + "%", animationDelay: "0s" }, 2200), 400 + i * 800));
    setTimeout(() => { const r = document.querySelector(".room"); r && r.classList.remove("night"); }, 4200); }
};
/* 狀態儀表 */
function petMeters(S){
  const P = S.P, today = dayKey(), fedN = P.fedDay === today ? Math.min(3, (P.fedN && P.fedN.d === today ? P.fedN.n : 1)) : 0;
  const h = new Date().getHours(), energy = P.slept === today ? 100 : h >= 23 || h < 6 ? 35 : h >= 18 ? 60 : 85;
  const M = [["🍖", "飽足", Math.round(fedN / 3 * 100), "#E58A3C"], ["💗", "心情", Math.round(Math.min(5, P.aff || 0) / 5 * 100), "#E5484D"], ["⚡", "精神", energy, "#3B7FE6"]];
  return `<div class="meters">${M.map(m => `<div class="meter" style="--mc:${m[3]}"><i>${m[0]}</i><b>${m[1]}</b><span class="mtube"><s style="width:${Math.max(6, m[2])}%"></s></span><em>${m[2]}%</em></div>`).join("")}</div>`;
}
